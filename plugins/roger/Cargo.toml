[package]
name = "roger"
description = "Roger, the vowel filter of Audio Ease's Rocket Science bundle (2001), rebuilt from the original binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "roger-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "roger-render"
path = "src/bin/roger_render.rs"

[features]
default = ["clap", "vst3", "au", "standalone-playback"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
vst2 = ["dep:truce-vst2"]
lv2 = ["dep:truce-lv2"]
aax = ["dep:truce-aax"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
standalone-playback = ["standalone", "truce-standalone/playback"]
shell = ["truce/shell"]

[dependencies]
truce = { workspace = true }
truce-core = { workspace = true }
truce-params = { workspace = true }
truce-clap = { workspace = true, optional = true }
truce-vst3 = { workspace = true, optional = true }
truce-vst2 = { workspace = true, optional = true }
truce-aax = { workspace = true, optional = true }
truce-au = { workspace = true, optional = true }
truce-lv2 = { workspace = true, optional = true }
clap-sys = { workspace = true, optional = true }
truce-standalone = { workspace = true, optional = true }
truce-loader = { workspace = true }
truce-egui = { workspace = true }
egui = { workspace = true }
hound = { workspace = true }
mission = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
truce-test = { workspace = true }
