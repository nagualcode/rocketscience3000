name: Release

# Builds the release binaries of the Rocket Science plug-ins (Roger3K; Follo3K
# and Orbit3K to come) for the three supported platforms and
# attaches them to the GitHub release of the tag that triggered the run.
#
#   macOS (Apple Silicon)  AU v2 + VST3 + CLAP + Standalone .apps + CLIs
#                          -> installer .pkg + rocketscience3000-<version>-macos-arm64.zip
#   Linux (x86_64)         CLAP + VST3 + LV2 + Standalones + CLIs
#                          -> .tar.gz (install.sh) + rocketscience3000-<version>-linux-x86_64.zip
#   Windows (x64)          CLAP + VST3 + Standalones + CLIs
#                          -> installer .exe + rocketscience3000-<version>-windows-x64.zip
#
# Tag a release (`git tag v0.1.0 && git push --tags`) to publish, or run the
# workflow by hand from the Actions tab to build the artifacts without
# touching any release (`publish: false`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the artifacts to the release for this tag"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-truce from the same truce revision Cargo.lock pins.
  TRUCE_REV: 25791270cf7ca1309cb6bdc6fa75a6fe94617d1c
  CRATES: roger
  CLIS: roger-render

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Apple Silicon)
    # Every current macos-* label is arm64. Don't pin a version: GitHub
    # retires old labels and the job is cancelled with no error.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-latest
          cache-bin: false

      - name: Version from Cargo.toml
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      - name: Tests
        run: cargo test --release --locked --workspace

      - name: Install cargo-truce
        run: cargo install --git https://github.com/truce-audio/truce --rev "$TRUCE_REV" cargo-truce --locked

      - name: Build plug-in bundles (AU v2 / VST3 / CLAP)
        run: cargo truce build --clap --vst3 --au2

      - name: Command-line renderers
        run: for b in $CLIS; do cargo build --release --locked --bin $b; done

      # --no-notarize: notarization needs a paid Apple Developer account,
      # which CI doesn't have. The pkg is ad-hoc signed; the README says how
      # to clear the quarantine flag.
      - name: Installer (.pkg)
        run: cargo truce package --host-only --no-notarize --formats clap,vst3,au2,standalone

      - name: Zip for manual install
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rocketscience3000-$VERSION-macos-arm64"
          mkdir -p "$stage"/{AU,VST3,CLAP,Standalone,CLI}
          cp -R target/bundles/*.component "$stage/AU/"
          cp -R target/bundles/*.vst3      "$stage/VST3/"
          cp -R target/bundles/*.clap      "$stage/CLAP/"
          find target/package -path '*_pkgroot_Standalone/*.app' -prune -exec cp -R {} "$stage/Standalone/" \;
          for b in $CLIS; do cp target/release/$b "$stage/CLI/"; done
          mkdir -p dist
          # -y keeps the bundles' symlinks intact.
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist/rocketscience3000-$VERSION-macos-arm64.zip" .)
          find target/dist -maxdepth 1 -name '*.pkg' -exec cp {} dist/ \;
          ls -la dist "$stage"/*

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ubuntu-24.04
          cache-bin: false

      # Same set truce's own Linux CI installs: X11/GL for the editor,
      # ALSA/JACK for the standalone host, fontconfig/freetype for text.
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev

      - name: Version from Cargo.toml
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      - name: Install cargo-truce
        run: cargo install --git https://github.com/truce-audio/truce --rev "$TRUCE_REV" cargo-truce --locked

      # AU is macOS-only, so Linux gets LV2 instead (Ardour, Qtractor, Carla).
      - name: Build plug-in bundles (CLAP / VST3 / LV2)
        run: cargo truce build --clap --vst3 --lv2

      - name: Standalone hosts and command-line renderers
        run: |
          for c in $CRATES; do
            cargo build --release --locked -p $c --no-default-features \
              --features clap,vst3,lv2,standalone-playback --bins
          done

      - name: Installer tarball (.tar.gz + install.sh)
        run: cargo truce package --formats clap,vst3,lv2,standalone

      - name: Zip for manual install
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rocketscience3000-$VERSION-linux-x86_64"
          mkdir -p "$stage"/{CLAP,VST3,LV2,Standalone,CLI}
          cp -R target/bundles/*.clap "$stage/CLAP/"
          cp -R target/bundles/*.vst3 "$stage/VST3/"
          cp -R target/bundles/*.lv2  "$stage/LV2/"
          for c in $CRATES; do cp target/release/$c-standalone "$stage/Standalone/"; done
          for b in $CLIS; do cp target/release/$b "$stage/CLI/"; done
          mkdir -p dist
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist/rocketscience3000-$VERSION-linux-x86_64.zip" .)
          find target/dist -maxdepth 1 -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # (The Mac OS 9 `Icon\r` metadata files are not tracked: a path with a
      # control character makes git refuse the whole checkout on Windows.)
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-latest
          cache-bin: false

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress --yes

      - name: Version from Cargo.toml
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      - name: Install cargo-truce
        run: cargo install --git https://github.com/truce-audio/truce --rev "$TRUCE_REV" cargo-truce --locked

      - name: Build plug-in bundles (CLAP / VST3)
        run: cargo truce build --clap --vst3

      - name: Standalone hosts and command-line renderers
        run: |
          for c in $CRATES; do
            cargo build --release --locked -p $c --no-default-features \
              --features clap,vst3,standalone-playback --bins
          done

      # No Authenticode certificate in CI: the installer is unsigned but valid.
      - name: Installer (.exe)
        run: cargo truce package --host-only --formats clap,vst3,standalone

      - name: Zip for manual install
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rocketscience3000-$VERSION-windows-x64"
          mkdir -p "$stage"/{CLAP,VST3,Standalone,CLI}
          cp -R target/bundles/*.clap "$stage/CLAP/"
          cp -R target/bundles/*.vst3 "$stage/VST3/"
          for c in $CRATES; do cp target/release/$c-standalone.exe "$stage/Standalone/"; done
          for b in $CLIS; do cp target/release/$b.exe "$stage/CLI/"; done
          mkdir -p dist
          (cd "$stage" && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/rocketscience3000-$VERSION-windows-x64.zip" .)
          find target/dist -maxdepth 1 -name '*.exe' -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          # A draft release if the tag has none yet, so the notes can be
          # written before it goes public.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "rocketscience3000 $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
