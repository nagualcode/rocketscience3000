name: Release

# Builds the release binaries of the Rocket Science plug-ins (Roger3K, Follo3K,
# Orbit3K) for the three supported platforms and
# publishes them as the GitHub release of the tag that triggered the run.
#
#   macOS (Apple Silicon)  AU v2 + VST3 + CLAP + Standalone .apps + CLIs
#                          -> installer .pkg + rocketscience3000-<version>-macos-arm64.zip
#   Linux (x86_64)         CLAP + VST3 + LV2 + Standalones + CLIs
#                          -> .tar.gz (install.sh) + rocketscience3000-<version>-linux-x86_64.zip
#   Windows (x64)          CLAP + VST3 + Standalones + CLIs
#                          -> installer .exe + rocketscience3000-<version>-windows-x64.zip
#
# Tag a release (`git tag v0.1.1 && git push --tags`) to build and publish
# it, or run the workflow by hand from the Actions tab to build the artifacts
# without touching any release (`publish: false`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
    name: Publish the release
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Published straight away (not a draft): the notes come from
      # .github/release-notes.md with {VERSION} filled in.
      - name: Create or update the release and upload the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          sed "s/{VERSION}/${TAG#v}/g" .github/release-notes.md > notes.md
          TITLE="rocketscience3000 $TAG (macOS, Linux e Windows) — Roger3K, Follo3K, Orbit3K"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --draft=false --latest
          else
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file notes.md --latest
          fi
