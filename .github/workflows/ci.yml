name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # cargo-truce from the same truce revision Cargo.lock pins.
  TRUCE_REV: 25791270cf7ca1309cb6bdc6fa75a6fe94617d1c
  PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
  CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-macos-universal.zip

jobs:
  macos:
    name: macOS — tests and validators
    # Not a pinned macos-NN: GitHub retires old labels and the job is then
    # cancelled a second after starting, with no steps run and no error.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit, engine and plug-in tests
        run: cargo test --release --locked --workspace

      - name: Install cargo-truce
        run: cargo install --git https://github.com/truce-audio/truce --rev "$TRUCE_REV" cargo-truce --locked

      - name: Build and install AU / VST3 / CLAP (user folders)
        run: cargo truce install --clap --vst3 --au2 --user

      - name: Fetch validators
        run: |
          mkdir -p "$RUNNER_TEMP/validators" && cd "$RUNNER_TEMP/validators"
          curl -sSfL -o pluginval.zip "$PLUGINVAL_URL" && unzip -q pluginval.zip
          curl -sSfL -o cv.zip "$CLAP_VALIDATOR_URL" && unzip -q cv.zip
          tar xzf clap-validator-*.tar.gz
          echo "CLAP_VALIDATOR=$PWD/binaries/clap-validator" >> "$GITHUB_ENV"
          echo "$PWD/pluginval.app/Contents/MacOS" >> "$GITHUB_PATH"

      - name: auval (AU v2) and pluginval (VST3)
        run: |
          killall -9 AudioComponentRegistrar || true
          cargo truce validate --auval --pluginval --skip-gui-tests

      - name: clap-validator (CLAP)
        # The state-reproducibility tests fail identically for truce's own
        # examples (truce v6.3.0); everything else must pass.
        run: |
          for p in Roger3K Follo3K Orbit3K; do
            "$CLAP_VALIDATOR" validate "$HOME/Library/Audio/Plug-Ins/CLAP/$p.clap" -x state-reproducibility
          done

  linux:
    name: Linux — tests (portable FFT, x86 MXCSR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev

      - name: Engine and plug-in tests
        # AU is macOS-only: the plug-in crates build here without it.
        run: |
          cargo test --release --locked -p mission
          for p in roger follo orbit; do
            cargo test --release --locked -p $p --no-default-features --features clap,vst3 --lib
          done
