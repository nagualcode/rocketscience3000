[workspace]
resolver = "3"
members = ["crates/mission", "plugins/roger", "plugins/follo", "plugins/orbit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nagualcode/rocketscience3000"
authors = ["Jardim Sonoro", "nagualcode"]

[workspace.dependencies]
truce = { git = "https://github.com/truce-audio/truce" }
truce-core = { git = "https://github.com/truce-audio/truce" }
truce-params = { git = "https://github.com/truce-audio/truce" }
truce-clap = { git = "https://github.com/truce-audio/truce" }
truce-vst3 = { git = "https://github.com/truce-audio/truce" }
truce-vst2 = { git = "https://github.com/truce-audio/truce" }
truce-aax = { git = "https://github.com/truce-audio/truce" }
truce-au = { git = "https://github.com/truce-audio/truce" }
truce-lv2 = { git = "https://github.com/truce-audio/truce" }
truce-standalone = { git = "https://github.com/truce-audio/truce", features = ["gui"] }
truce-loader = { git = "https://github.com/truce-audio/truce" }
truce-egui = { git = "https://github.com/truce-audio/truce" }
truce-test = { git = "https://github.com/truce-audio/truce" }
clap-sys = "0.5"
egui = "0.34"
hound = "3.5"
rfd = "0.15"
mission = { path = "crates/mission" }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
